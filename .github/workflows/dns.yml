name: dns

on:
  push:
    paths:
      - 'app/lib/core/dns.dart'
      - 'app/lib/core/doh.dart'
      - 'app/tool/doh_probe.dart'
      - '.github/workflows/dns.yml'
  pull_request:
    paths:
      - 'app/lib/core/dns.dart'
      - 'app/lib/core/doh.dart'
      - 'app/tool/doh_probe.dart'
      - '.github/workflows/dns.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Resolve over the secure transport
        working-directory: app
        run: dart run tool/doh_probe.dart
